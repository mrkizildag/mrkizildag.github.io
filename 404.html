<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found &mdash; Mete Reis Kizildag</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=IBM+Plex+Sans:wght@400&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        color-scheme: light dark;
        --paper: #e3e7e0;
        --ink: #16241f;
        --ink-soft: #4d5c55;
        --accent: #1f3f7a;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #121b18;
          --ink: #dfe5dd;
          --ink-soft: #94a49b;
          --accent: #91b4ea;
        }
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        align-content: center;
        padding: clamp(1.75rem, 7vw, 7rem);
        background: var(--paper);
        color: var(--ink);
        font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system,
          "Segoe UI", Helvetica, Arial, sans-serif;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }

      h1 {
        font-family: "Bodoni Moda", "Didot", "Bodoni MT", Georgia, serif;
        font-optical-sizing: auto;
        font-weight: 500;
        font-size: clamp(2.75rem, 9vw, 6rem);
        line-height: 0.96;
        letter-spacing: -0.02em;
        margin: 0 0 1.25rem;
      }

      p {
        margin: 0 0 1.75rem;
        max-width: 34em;
        color: var(--ink-soft);
      }

      a {
        color: var(--accent);
        text-decoration-thickness: 1px;
        text-underline-offset: 0.2em;
      }

      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Nothing here</h1>
      <p>That page doesn&rsquo;t exist.</p>
      <a href="/">Back to the front</a>
    </main>
  </body>
</html>
