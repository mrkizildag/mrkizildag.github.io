<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ossa &mdash; Ossa</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=IBM+Plex+Sans:wght@400&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light dark;
        --paper: #e3e7e0;
        --ink: #16241f;
        --ink-soft: #4d5c55;
        --accent: #1f3f7a;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #121b18;
          --ink: #dfe5dd;
          --ink-soft: #94a49b;
          --accent: #91b4ea;
        }
      }

      body {
        margin: 0;
                        padding: clamp(1.75rem, 7vw, 7rem);
        background: var(--paper);
        color: var(--ink);
        font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system,
          "Segoe UI", Helvetica, Arial, sans-serif;
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }

      h1 {
        font-family: "Bodoni Moda", "Didot", "Bodoni MT", Georgia, serif;
        font-optical-sizing: auto;
        font-weight: 500;
        font-size: clamp(2.75rem, 9vw, 6rem);
        line-height: 0.96;
        letter-spacing: -0.02em;
        margin: 0 0 1.25rem;
      }

      p {
        margin: 0 0 1.75rem;
        max-width: 34em;
        color: var(--ink-soft);
      }

      a {
        color: var(--accent);
        text-decoration-thickness: 1px;
        text-underline-offset: 0.2em;
      }

      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
    
      h1 { font-size: clamp(2.5rem, 7vw, 4.5rem); }
      h2 { font-family: "Bodoni Moda", Georgia, serif; font-weight: 500; font-size: 1.5rem; margin: 2rem 0 0.5rem; }
      nav { margin-bottom: 2.5rem; display: flex; gap: 1.25rem; flex-wrap: wrap; }
      li { color: var(--ink-soft); max-width: 34em; }
    </style>
  </head>
  <body>
    <main>
      <nav><a href="/ossa/">Ossa</a><a href="/ossa/privacy.html">Privacy policy</a><a href="/ossa/terms.html">Terms of service</a></nav>
      <h1>Ossa</h1>
      <p>Ossa is a personal, self-hosted email client for Gmail. Mete Reis Kizildag built it and is its only user. It runs on his own computer and is not offered to anyone else.</p>
      <p>Questions: <a href="mailto:mrkizildag@gmail.com">mrkizildag@gmail.com</a></p>
    </main>
  </body>
</html>
